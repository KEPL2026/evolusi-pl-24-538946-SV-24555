name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

# Izinkan GITHUB_TOKEN untuk membuat PR dan merge
permissions:
  contents: write
  pull-requests: write

jobs:
  # ========================================================
  # Job 1: Backend (PHP, Code Quality & Automated Tests)
  # ========================================================
  backend:
    name: Backend CI (PHP / Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, json, tokenizer, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Environment File & App Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ensure SQLite Database Exists
        run: touch database/database.sqlite

      - name: Check Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run Backend Tests (PHPUnit)
        run: php artisan test

  # ========================================================
  # Job 2: Frontend (Node.js, Dependencies & Vite Build)
  # ========================================================
  frontend:
    name: Frontend CI (Node / React Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f public/build/manifest.json
          echo "Vite build completed and manifest generated successfully!"

  # ========================================================
  # Job 3: Auto PR feat/* → dev + Auto Merge
  # Berjalan hanya saat push ke branch feat/**
  # ========================================================
  auto-pr-feat-to-dev:
    name: Auto PR & Merge (feat → dev)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Branch Name
        id: branch
        run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Create Pull Request feat → dev
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          head: ${{ steps.branch.outputs.name }}
          title: "feat: Auto PR from ${{ steps.branch.outputs.name }} → dev"
          body: |
            ## 🤖 Auto-generated Pull Request

            **Source branch**: `${{ steps.branch.outputs.name }}`
            **Target branch**: `dev`

            Pull request ini dibuat secara otomatis oleh CI/CD pipeline setelah semua
            pengujian backend (PHP/Laravel) dan frontend (Node/Vite) berhasil ✅

            ---
            *Trigger: push ke `${{ steps.branch.outputs.name }}`*
          labels: auto-merge, feat-to-dev
          draft: false

      - name: Enable Auto-Merge (Merge Commit)
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: merge

      - name: Log PR Result
        run: |
          echo "✅ Pull Request #${{ steps.create-pr.outputs.pull-request-number }} berhasil dibuat."
          echo "🔗 URL: ${{ steps.create-pr.outputs.pull-request-url }}"
          echo "🔀 Auto-merge diaktifkan, PR akan otomatis ter-merge setelah status check selesai."

  # ========================================================
  # Job 4: Auto PR dev → master (Merge Manual oleh Reviewer)
  # Berjalan hanya saat push ke branch dev
  # ========================================================
  auto-pr-dev-to-master:
    name: Auto PR (dev → master)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request dev → master
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          head: dev
          title: "release: Auto PR from dev → master"
          body: |
            ## 🚀 Release Pull Request

            **Source branch**: `dev`
            **Target branch**: `master`

            Pull request ini dibuat secara otomatis oleh CI/CD pipeline setelah semua
            pengujian backend (PHP/Laravel) dan frontend (Node/Vite) berhasil ✅

            ### ⚠️ Perlu Review Manual
            PR ini memerlukan review dan approval dari reviewer sebelum di-merge ke `master`.

            ---
            *Trigger: push ke `dev`*
          labels: release, dev-to-master
          draft: false

      - name: Log PR Result
        run: |
          if [ -n "${{ steps.create-pr.outputs.pull-request-number }}" ]; then
            echo "✅ Pull Request #${{ steps.create-pr.outputs.pull-request-number }} berhasil dibuat."
            echo "🔗 URL: ${{ steps.create-pr.outputs.pull-request-url }}"
            echo "👥 Menunggu review dari reviewer sebelum merge ke master."
          else
            echo "ℹ️ PR sudah ada sebelumnya atau tidak ada perubahan baru antara dev dan master."
          fi
